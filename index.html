<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fbf5e8">
  <title>Blondie Cook Pastry — Erenköy Atelier</title>
  <meta name="description" content="Explore the 75 m² Blondie Cook Pastry Erenköy atelier in 3D.">
  <link rel="canonical" href="https://blondiecookpastry.com/">
  <link rel="icon" href="./img/logo-256.png">
  <link rel="preload" as="image" href="./assets/entrance-desktop--suhg2wJ.png" media="(aspect-ratio > 4/5)" fetchpriority="high">
  <link rel="preload" as="image" href="./assets/entrance-mobile-C2tYh4LE.png" media="(max-aspect-ratio: 4/5)" fetchpriority="high">
  <script type="module" crossorigin src="./assets/index-DY9hruod.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BFaIeYWh.css">
</head>
<body>
  <canvas id="view"></canvas>

  <div id="loading">
    <picture class="entrance-preview">
      <source media="(max-aspect-ratio: 4/5)" srcset="./assets/entrance-mobile-C2tYh4LE.png">
      <img src="./assets/entrance-desktop--suhg2wJ.png" alt="" width="1200" height="800" fetchpriority="high">
    </picture>
    <div class="loading-card">
      <p id="loading-name">Erenköy Atölyesi</p>
      <p class="loading-status" role="status" data-i18n="loadingEntrance">Atölye hazırlanıyor…</p>
      <div class="bar" aria-hidden="true"><i id="loading-bar"></i></div>
      <a id="loading-shopier" class="pill accent" href="https://www.shopier.com/BlondieCookPastry" target="_blank" rel="noopener" data-i18n="shopierMenu">Shopier menüsünü aç ↗</a>
      <button id="loading-retry" class="pill" data-i18n="retry" hidden>Tekrar dene</button>
      <noscript>3D atölye için JavaScript gerekir. Shopier menüsünden alışveriş yapabilirsiniz.</noscript>
    </div>
  </div>

  <div id="hud" hidden>
    <div class="top">
      <div id="shop-identity" class="pill">
        <span id="hud-name"></span>
      </div>
      <div class="spacer"></div>
      <button id="btn-night" class="pill icon-button" aria-label="Gündüze geç"></button>
      <button id="btn-menu" class="pill accent" data-i18n="menu" data-i18n-title="menuTitle">Menü</button>
      <button id="btn-quality" class="pill icon-button" aria-label="Görüntü kalitesi"></button>
    </div>
    <div id="zone"></div>
    <div id="hint"></div>
    <button id="prompt" hidden></button>
    <i id="reticle" hidden></i>
    <a id="product" target="_blank" rel="noopener" hidden>
      <img id="product-img" alt="" width="64" height="64">
      <span><small id="product-section"></small><b id="product-name"></b><em id="product-price"></em></span>
    </a>
    <div id="stick"><i></i></div>
  </div>

  <aside id="menu" hidden>
    <div class="menu-head">
      <div>
        <h2 data-i18n="menu">Menü</h2>
        <p><span data-i18n="orderPrefix">Sipariş:</span> <a id="store-link" href="https://www.shopier.com/BlondieCookPastry" target="_blank" rel="noopener">Shopier</a></p>
      </div>
      <button id="menu-close" class="pill" data-i18n="close">Kapat</button>
    </div>
    <nav id="menu-tabs"></nav>
    <div id="menu-list"></div>
  </aside>

  <div id="language-picker">
    <button id="btn-language" class="pill icon-button" aria-label="Dil seçimi" aria-haspopup="menu" aria-expanded="false" aria-controls="language-options">🇹🇷</button>
    <div id="language-options" role="menu" hidden>
      <button role="menuitemradio" data-language="tr" lang="tr" aria-checked="true">🇹🇷 Türkçe</button>
      <button role="menuitemradio" data-language="en" lang="en" aria-checked="false">🇬🇧 English</button>
    </div>
  </div>

</body>
</html>
